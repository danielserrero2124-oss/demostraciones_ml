title: "Demostraciones — Machine Learning"
author: "Daniel Serrano Romero"
copyright: "2026"
logo: "images/logo_uninorte.png"
only_build_toc_files: true

execute:
  execute_notebooks: force
  timeout: 300

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence
    - deflist
    - html_image
    - substitution

bibtex_bibfiles:
  - references.bib

sphinx:
  extra_extensions:
    - sphinx_proof
  config:
    language: es
    html_show_copyright: true
    bibtex_reference_style: author_year
    mathjax3_config:
      tex:
        macros:
          "R": "\\mathbb{R}"
          "E": "\\mathbb{E}"
          "P": "\\mathbb{P}"
          "ind": ["\\mathbb{1}_{\\left[#1\\right]}", 1]
          "bx": "\\boldsymbol{x}"
          "bbeta": "\\boldsymbol{\\beta}"
          "by": "\\boldsymbol{y}"
          "btheta": "\\boldsymbol{\\theta}"
          "beps": "\\boldsymbol{\\varepsilon}"
          "uno": "\\boldsymbol{1}"
          "D": "\\mathcal{D}"
          "sgn": "\\operatorname{sgn}"
          "tr": "\\operatorname{tr}"

html:
  use_issues_button: false
  use_repository_button: false
  home_page_in_navbar: true

latex:
  latex_documents:
    targetname: demostraciones.tex
